# One command from a cold start: docker compose up --build
#
# Ports are deliberately non-default on the host side. Nook's Postgres must not
# collide with a Postgres already running on 5432, and finding that out through
# a confusing connection error wastes an afternoon.

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: nook
      POSTGRES_PASSWORD: nook_local_only
      POSTGRES_DB: nook
    ports: ["55432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nook -d nook"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # MinIO stands in for S3 locally so the presigned-URL path is exercised the
  # same way it will be against the real thing. Same SDK, same signature.
  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: nook
      MINIO_ROOT_PASSWORD: nook_local_only
    ports: ["59000:9000", "59001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgres://nook:nook_local_only@postgres:5432/nook
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local_dev_secret_replace_in_every_real_environment
      LOG_LEVEL: info
      PORT: 3000
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # The same probe paths Kubernetes will use in stage 04. Exercising them
    # locally means the manifests are not the first place they are tried.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Matches terminationGracePeriodSeconds in stage 04, so shutdown behaviour
    # is identical in both places.
    stop_grace_period: 30s

volumes:
  pgdata:
  miniodata:
