# One command from a cold start: docker compose up --build
#
# Ports are deliberately non-default on the host side. Nook's Postgres must not
# collide with a Postgres already running on 5432, and finding that out through
# a confusing connection error wastes an afternoon.

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: nook
      POSTGRES_PASSWORD: nook_local_only
      POSTGRES_DB: nook
    ports: ["55432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nook -d nook"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # MinIO stands in for S3 locally so the presigned-URL path is exercised the
  # same way it will be against the real thing. Same SDK, same signature.
  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: nook
      MINIO_ROOT_PASSWORD: nook_local_only
    ports: ["59000:9000", "59001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgres://nook:nook_local_only@postgres:5432/nook
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local_dev_secret_replace_in_every_real_environment
      LOG_LEVEL: info
      PORT: 3000
      S3_ENDPOINT: http://minio:9000
      # What the browser can reach. In AWS this is unset: S3's endpoint is
      # already public, so the signing client and the API client are the same.
      S3_PUBLIC_ENDPOINT: http://localhost:59000
      S3_BUCKET: nook-attachments
      S3_ACCESS_KEY: nook
      S3_SECRET_KEY: nook_local_only
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    # The same probe paths Kubernetes will use in stage 04. Exercising them
    # locally means the manifests are not the first place they are tried.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Matches terminationGracePeriodSeconds in stage 04, so shutdown behaviour
    # is identical in both places.
    stop_grace_period: 30s

  # Two replicas by default. One replica would let a broken Redis backplane
  # pass every local test — the failure only appears when two processes have
  # to agree, which is exactly the condition production runs in.
  collab:
    build:
      context: .
      dockerfile: services/collab/Dockerfile
    environment:
      DATABASE_URL: postgres://nook:nook_local_only@postgres:5432/nook
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local_dev_secret_replace_in_every_real_environment
      LOG_LEVEL: info
      PORT: 3001
    deploy:
      replicas: 2
    ports: ["3001-3002:3001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Longer than api: draining sockets takes longer than draining requests.
    stop_grace_period: 40s

  # One-shot: creates the bucket, then exits. Services that need the bucket
  # wait on service_completed_successfully rather than racing it.
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 nook nook_local_only &&
      mc mb --ignore-existing local/nook-attachments &&
      echo bucket ready"

  exporter:
    build:
      context: .
      dockerfile: services/exporter/Dockerfile
    environment:
      PORT: 3003
    ports: ["3003:3003"]
    # No healthcheck: the distroless image has no shell and no curl, which is
    # the trade for a 7 MB image with nothing to pivot to. Kubernetes probes it
    # over HTTP directly and does not need a binary in the image; compose
    # cannot, so this one is unchecked locally.
    stop_grace_period: 20s

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://nook:nook_local_only@postgres:5432/nook
      REDIS_URL: redis://redis:6379
      EXPORTER_URL: http://exporter:3003
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: nook-attachments
      S3_ACCESS_KEY: nook
      S3_SECRET_KEY: nook_local_only
      LOG_LEVEL: info
      PORT: 3004
    ports: ["3004:3004"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3004/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 40s

volumes:
  pgdata:
  miniodata:
