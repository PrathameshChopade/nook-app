server {
  listen 8080;
  # Listen on IPv6 too. Inside a container `localhost` usually resolves to ::1
  # first, so an IPv4-only listener refuses connections that look correct to
  # whatever is probing it.
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;

  # Hashed asset names are immutable by construction: a change to the file
  # changes the name. So they can be cached for a year and never revalidated,
  # which is the entire reason the build emits [name].[hash].js.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html is the opposite: it is the only file whose name never changes,
  # so it must never be cached. Cache it and users keep loading an old page
  # that references assets which no longer exist.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
    expires off;
  }

  # A single-page app: unknown paths are routes, not missing files.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin in the browser, which is what the Ingress does in stage 03.
  # Keeping the shape identical locally means CORS never has to be configured
  # in one place and forgotten in the other.
  location /v1/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /collab/ {
    proxy_pass http://collab:3001/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # Long timeouts: a collaborative session is idle for minutes at a time
    # while someone reads. The default 60s would drop every quiet editor and
    # the reconnect storm would look like a server fault.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location = /healthz {
    access_log off;
    return 200 '{"status":"ok"}';
    add_header content-type application/json;
  }
}
